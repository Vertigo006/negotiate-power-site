name: Accessibility diagnostic
on:
  push:
    branches: [website-commercial-compression-2026-09-04]
    paths: [.github/workflows/qa-smoke.yml]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-commercial-compression-2026-09-04
          fetch-depth: 0
      - run: bash scripts/axe-diagnostic.sh

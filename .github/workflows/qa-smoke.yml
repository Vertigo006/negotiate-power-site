name: Commercial closure QA
on:
  push:
    branches: [website-commercial-compression-2026-09-04]
    paths:
      - '.github/workflows/qa-smoke.yml'
      - 'scripts/commercial-closure-qa.sh'
      - '*.html'
      - 'intelligence/*.html'
      - 'assets/css/*.css'
      - 'assets/js/*.js'
permissions:
  contents: write
jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-commercial-compression-2026-09-04
          fetch-depth: 0
      - run: bash scripts/commercial-closure-qa.sh

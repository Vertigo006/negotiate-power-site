name: Decision Room runtime verification

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime test dependencies
        run: |
          npm install --no-save @playwright/test @axe-core/playwright
          npx playwright install --with-deps chromium webkit
      - name: Serve site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/decision-room-http.log 2>&1 &
          echo $! > /tmp/decision-room-http.pid
          sleep 2
      - name: Run Decision Room protocol machine checks
        run: node scripts/verify-decision-room-runtime.mjs

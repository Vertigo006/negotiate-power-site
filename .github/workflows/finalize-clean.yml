name: Finalize QA cleanup
on:
  push:
    branches: [website-commercial-compression-2026-09-04]
    paths: ['.github/workflows/finalize-clean.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-commercial-compression-2026-09-04
          fetch-depth: 0
      - run: |
          python scripts/finalize-commercial-qa.py
          rm -f scripts/finalize-commercial-qa.py .github/workflows/finalize-clean.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize commercial QA harness cleanup'
          git push origin HEAD:website-commercial-compression-2026-09-04

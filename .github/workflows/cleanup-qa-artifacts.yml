name: Clean QA artifacts
on:
  push:
    branches: [website-commercial-compression-2026-09-04]
    paths: ['.github/workflows/cleanup-qa-artifacts.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-commercial-compression-2026-09-04
          fetch-depth: 0
      - run: |
          rm -rf node_modules
          rm -f .github/workflows/a11y-diagnostic.yml .github/workflows/remediate-a11y.yml
          rm -f scripts/axe-diagnostic.sh scripts/apply-a11y-closure-fixes.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary QA diagnostics and test artifacts'
          git push origin HEAD:website-commercial-compression-2026-09-04

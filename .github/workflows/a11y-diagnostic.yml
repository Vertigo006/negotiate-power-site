name: Accessibility diagnostic
on:
  push:
    branches: [website-commercial-compression-2026-09-04]
    paths: ['.github/workflows/a11y-diagnostic.yml']
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-commercial-compression-2026-09-04
      - run: |
          python scripts/apply-a11y-closure-fixes.py
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright axe-core >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          sleep 2
          cat > .tmp-a11y-diagnostic.js <<'JS'
          const { chromium } = require('playwright');
          const axePath = require.resolve('axe-core/axe.min.js');
          const pages=['/atlas.html','/intelligence.html'];
          (async()=>{const b=await chromium.launch({headless:true});for(const p of pages){for(const width of [1440,390]){const c=await b.newContext({viewport:{width,height:900}});const page=await c.newPage();await page.route('https://www.googletagmanager.com/**',r=>r.abort());await page.goto('http://127.0.0.1:4173'+p,{waitUntil:'domcontentloaded'});await page.addScriptTag({path:axePath});const r=await page.evaluate(async()=>await axe.run(document,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa']}}));for(const v of r.violations.filter(v=>['serious','critical'].includes(v.impact))){console.log(`PAGE ${p} WIDTH ${width} RULE ${v.id}`);for(const n of v.nodes){console.log('TARGET',JSON.stringify(n.target));console.log('HTML',n.html);console.log('SUMMARY',n.failureSummary);}}await c.close();}}await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node .tmp-a11y-diagnostic.js
